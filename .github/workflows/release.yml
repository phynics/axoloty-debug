name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify VERSION matches the tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi

  build:
    name: Build linux-${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    container: swift:6.4-jammy
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build release products
        run: swift build -c release --static-swift-stdlib
      - name: Package binaries
        run: |
          name="axoloty-debug-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          bin=$(swift build -c release --show-bin-path)
          mkdir -p "dist/$name"
          cp "$bin/axoloty-debug" "$bin/axoloty-inspect" "$bin/axoloty-mcp" "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz*

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  image:
    name: Publish container image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Stage binaries per architecture
        run: |
          mkdir -p ctx/amd64 ctx/arm64
          tar -xzf dist/*-linux-x86_64.tar.gz --strip-components=1 -C ctx/amd64
          tar -xzf dist/*-linux-aarch64.tar.gz --strip-components=1 -C ctx/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compute tags
        id: tags
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/phynics/axoloty-debug:${{ steps.tags.outputs.version }}
            ghcr.io/phynics/axoloty-debug:latest
