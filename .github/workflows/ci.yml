name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    container: swift:6.4-jammy
    steps:
      - name: Checkout axoloty-debug
        uses: actions/checkout@v4
      - name: Build all products
        run: swift build -Xswiftc -warnings-as-errors
      # --no-parallel avoids the CPU oversubscription that can push the
      # MCP lifecycle stop deadline over its bound on shared runners.
      - name: Run tests
        run: swift test --no-parallel -Xswiftc -warnings-as-errors
